server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on; gzip_types application/json application/javascript text/css; gzip_min_length 1024;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:8520 ws://localhost:8520; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location / { try_files $uri $uri/ $uri.html =404; }
  location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
